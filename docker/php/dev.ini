; Overrides de performance para desenvolvimento local (Windows/macOS bind mounts).
; Montado em docker-compose.dev.yml como 99-dev.ini (ganha do opcache.ini de produção).

; Em dev precisamos ver mudanças de código sem rebuild.
opcache.validate_timestamps=1
; Não revalidar a cada request (bind mount Windows/macOS é lento em stat()).
; 2s = bom equilíbrio; se alterar e não refletir, aguarde 2s ou reinicie o container app.
opcache.revalidate_freq=2

; JIT um pouco mais conservador em hot-reload
opcache.jit=1255
opcache.jit_buffer_size=64M

realpath_cache_size=4096K
realpath_cache_ttl=120

; Menos barulho / um pouco mais de memória pra Laravel
memory_limit=512M
max_execution_time=120
