# Desenvolvimento local do gateway (app + agent + DB/Redis do host).
# Uso:
#   docker compose -f docker-compose.local-db.yml up -d
#   docker compose -f docker-compose.dev.yml up --build
#
# Postgres: localhost:5433 | Redis: localhost:6379

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: getfy_app:dev
    restart: unless-stopped
    ports:
      - "${GETFY_HTTP_PORT:-8085}:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/99-uploads.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost:8085}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "true"
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${LOCALDB_PG_PORT:-5433}
      DB_DATABASE: ${LOCALDB_POSTGRES_DB:-getfy}
      DB_USERNAME: ${LOCALDB_POSTGRES_USER:-getfy}
      DB_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-getfy}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${LOCALDB_REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      STACKER_LICENSE_DISABLED: ${STACKER_LICENSE_DISABLED:-1}
      STACKER_API_URL: ${STACKER_API_URL:-http://host.docker.internal:3000}
      STACKER_AGENT_TOKEN: ${STACKER_AGENT_TOKEN:-dev-agent-token}
    depends_on:
      stacker-agent:
        condition: service_started

  stacker-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: stacker_agent:dev
    restart: unless-stopped
    environment:
      STACKER_API_URL: ${STACKER_API_URL:-http://host.docker.internal:3000}
      STACKER_AGENT_TOKEN: ${STACKER_AGENT_TOKEN:-dev-agent-token}
      STACKER_GATEWAY_ROOT: /gateway
      APP_URL: ${GETFY_APP_URL:-http://localhost:8085}
      STACKER_RELEASE_SIGNING_KEY: ${STACKER_RELEASE_SIGNING_KEY:-dev-signing-key-change-me}
      STACKER_LICENSE_DISABLED: ${STACKER_LICENSE_DISABLED:-1}
    volumes:
      - .:/gateway
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: getfy_app:dev
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=integrax-sms,utmify-tracking,webhooks-outbound,webhooks-inbound,payments,default"
      - "--sleep=2"
      - "--tries=3"
      - "--timeout=120"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${LOCALDB_PG_PORT:-5433}
      DB_DATABASE: ${LOCALDB_POSTGRES_DB:-getfy}
      DB_USERNAME: ${LOCALDB_POSTGRES_USER:-getfy}
      DB_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-getfy}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${LOCALDB_REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_started

  scheduler:
    image: getfy_app:dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: ${LOCALDB_PG_PORT:-5433}
      DB_DATABASE: ${LOCALDB_POSTGRES_DB:-getfy}
      DB_USERNAME: ${LOCALDB_POSTGRES_USER:-getfy}
      DB_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-getfy}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${LOCALDB_REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_started
