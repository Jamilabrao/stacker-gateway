name: Gateway release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - VERSION
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - routes/**
      - resources/**
      - docker/**
      - agent/**
      - scripts/**
      - composer.json
      - composer.lock
      - Dockerfile
      - docker-compose*.yml
      - .github/workflows/gateway-release.yml
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, intl, bcmath, pcntl, exif
          tools: composer:v2
          coverage: none

      - name: Build frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts --ignore-platform-reqs

      - name: Build production zip
        env:
          GETFY_SKIP_FRONTEND_BUILD: '1'
          GETFY_SKIP_COMPOSER_INSTALL: '1'
        run: |
          chmod +x scripts/build-release.sh
          bash scripts/build-release.sh
          ls -lh dist-releases/

      - name: Upload release to Stacker API
        env:
          STACKER_API_URL: ${{ secrets.STACKER_API_URL }}
          STACKER_RELEASE_UPLOAD_TOKEN: ${{ secrets.STACKER_RELEASE_UPLOAD_TOKEN }}
          STACKER_ADMIN_TOKEN: ${{ secrets.STACKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < VERSION)"
          ZIP="dist-releases/stacker-gateway-${VERSION}.zip"
          echo "Versão: ${VERSION}"
          echo "Artefato: ${ZIP} ($(wc -c < "$ZIP") bytes)"
          if [ ! -f "$ZIP" ]; then
            echo "Artefato não encontrado: $ZIP" >&2
            exit 1
          fi
          if [ -z "${STACKER_API_URL:-}" ]; then
            echo "Secret STACKER_API_URL obrigatório." >&2
            exit 1
          fi
          API="${STACKER_API_URL%/}/api/gateway/releases/ci-upload"
          if [ -n "${STACKER_RELEASE_UPLOAD_TOKEN:-}" ]; then
            echo "Upload via STACKER_RELEASE_UPLOAD_TOKEN"
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/stacker-upload.json -X POST "$API" \
              -H "X-Stacker-Release-Token: ${STACKER_RELEASE_UPLOAD_TOKEN}" \
              -F "artifact=@${ZIP}" \
              -F "version=${VERSION}" \
              -F "title=Release ${VERSION}")"
          elif [ -n "${STACKER_ADMIN_TOKEN:-}" ]; then
            echo "Upload via STACKER_ADMIN_TOKEN (JWT — expira; prefira STACKER_RELEASE_UPLOAD_TOKEN)"
            API="${STACKER_API_URL%/}/api/gateway/releases"
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/stacker-upload.json -X POST "$API" \
              -H "Authorization: Bearer ${STACKER_ADMIN_TOKEN}" \
              -F "artifact=@${ZIP}" \
              -F "version=${VERSION}" \
              -F "title=Release ${VERSION}")"
          else
            echo "Configure STACKER_RELEASE_UPLOAD_TOKEN ou STACKER_ADMIN_TOKEN nos secrets." >&2
            exit 1
          fi
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/stacker-upload.json
          if [ "$HTTP_CODE" = "409" ]; then
            echo "Versão ${VERSION} já existe — incremente VERSION e rode de novo." >&2
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Upload falhou (HTTP ${HTTP_CODE})." >&2
            exit 1
          fi
