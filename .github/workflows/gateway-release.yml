name: Gateway release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - VERSION
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - routes/**
      - resources/**
      - docker/**
      - agent/**
      - scripts/**
      - composer.json
      - composer.lock
      - Dockerfile
      - docker-compose*.yml
      - .github/workflows/gateway-release.yml
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Stacker API and upload token
        env:
          STACKER_API_URL: ${{ secrets.STACKER_API_URL }}
          STACKER_RELEASE_UPLOAD_TOKEN: ${{ secrets.STACKER_RELEASE_UPLOAD_TOKEN }}
          STACKER_ADMIN_TOKEN: ${{ secrets.STACKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STACKER_API_URL:-}" ]; then
            echo "Secret STACKER_API_URL obrigatório." >&2
            exit 1
          fi
          echo "API: ${STACKER_API_URL%/}"
          curl -sf "${STACKER_API_URL%/}/api/health" | head -c 200
          echo ""
          HEALTH="$(curl -sS "${STACKER_API_URL%/}/api/gateway/releases/ci-upload/health" || true)"
          echo "CI upload health: ${HEALTH}"
          if [ -n "${STACKER_RELEASE_UPLOAD_TOKEN:-}" ]; then
            CODE="$(curl -sS -w '%{http_code}' -o /tmp/token-ping.json -X POST "${STACKER_API_URL%/}/api/gateway/releases/ci-upload" \
              -H "X-Stacker-Release-Token: ${STACKER_RELEASE_UPLOAD_TOKEN}" \
              -F "version=0.0.0-ci-ping" -F "title=ping")"
            echo "Token probe HTTP ${CODE}"
            cat /tmp/token-ping.json || true
            if [ "$CODE" = "400" ]; then
              echo "Token OK (400 = zip ausente, esperado)."
            elif [ "$CODE" = "401" ]; then
              echo "Token inválido — o valor em backend/.env deve ser idêntico ao secret STACKER_RELEASE_UPLOAD_TOKEN." >&2
              exit 1
            elif [ "$CODE" = "404" ]; then
              echo "Endpoint ci-upload não encontrado — faça deploy da API (update.sh na VPS)." >&2
              exit 1
            else
              echo "Res['${CODE}'] inesperado no probe de token." >&2
              exit 1
            fi
          elif [ -n "${STACKER_ADMIN_TOKEN:-}" ]; then
            echo "Aviso: usando STACKER_ADMIN_TOKEN (JWT expira). Prefira STACKER_RELEASE_UPLOAD_TOKEN."
          else
            echo "Configure STACKER_RELEASE_UPLOAD_TOKEN nos secrets do repo." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, intl, bcmath, pcntl, exif
          tools: composer:v2
          coverage: none

      - name: Build frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts --ignore-platform-reqs

      - name: Build production zip
        env:
          GETFY_SKIP_FRONTEND_BUILD: '1'
          GETFY_SKIP_COMPOSER_INSTALL: '1'
        run: |
          chmod +x scripts/build-release.sh
          bash scripts/build-release.sh
          ls -lh dist-releases/

      - name: Upload release to Stacker API
        env:
          STACKER_API_URL: ${{ secrets.STACKER_API_URL }}
          STACKER_RELEASE_UPLOAD_TOKEN: ${{ secrets.STACKER_RELEASE_UPLOAD_TOKEN }}
          STACKER_ADMIN_TOKEN: ${{ secrets.STACKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < VERSION)"
          ZIP="dist-releases/stacker-gateway-${VERSION}.zip"
          ZIP_BYTES="$(wc -c < "$ZIP")"
          echo "Versão: ${VERSION}"
          echo "Artefato: ${ZIP} (${ZIP_BYTES} bytes)"
          if [ ! -f "$ZIP" ]; then
            echo "Artefato não encontrado: $ZIP" >&2
            exit 1
          fi
          MAX_CF=$((100 * 1024 * 1024))
          if [ "$ZIP_BYTES" -gt "$MAX_CF" ]; then
            echo "Zip (${ZIP_BYTES} bytes) excede ~100MB — Cloudflare bloqueia upload com proxy laranja." >&2
            echo "Solução: Cloudflare → DNS → api.stacker.builders → desligar proxy (nuvem CINZA)." >&2
            exit 1
          fi
          API="${STACKER_API_URL%/}/api/gateway/releases/ci-upload"
          if [ -n "${STACKER_RELEASE_UPLOAD_TOKEN:-}" ]; then
            echo "Upload via STACKER_RELEASE_UPLOAD_TOKEN"
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/stacker-upload.json -X POST "$API" \
              -H "X-Stacker-Release-Token: ${STACKER_RELEASE_UPLOAD_TOKEN}" \
              -F "artifact=@${ZIP}" \
              -F "version=${VERSION}" \
              -F "title=Release ${VERSION}")"
          elif [ -n "${STACKER_ADMIN_TOKEN:-}" ]; then
            echo "Upload via STACKER_ADMIN_TOKEN"
            API="${STACKER_API_URL%/}/api/gateway/releases"
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/stacker-upload.json -X POST "$API" \
              -H "Authorization: Bearer ${STACKER_ADMIN_TOKEN}" \
              -F "artifact=@${ZIP}" \
              -F "version=${VERSION}" \
              -F "title=Release ${VERSION}")"
          else
            echo "Configure STACKER_RELEASE_UPLOAD_TOKEN ou STACKER_ADMIN_TOKEN nos secrets." >&2
            exit 1
          fi
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/stacker-upload.json
          if [ "$HTTP_CODE" = "409" ]; then
            echo "Versão ${VERSION} já existe — incremente VERSION e rode de novo." >&2
            exit 1
          fi
          if [ "$HTTP_CODE" = "413" ]; then
            echo "Upload rejeitado (413). Cloudflare/proxy limita ~100MB — use DNS only em api.stacker.builders." >&2
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Upload falhou (HTTP ${HTTP_CODE})." >&2
            exit 1
          fi
