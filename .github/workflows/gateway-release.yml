name: Gateway release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - VERSION
      - docs/releases/**
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - routes/**
      - resources/**
      - docker/**
      - agent/**
      - scripts/**
      - composer.json
      - composer.lock
      - Dockerfile
      - docker-compose*.yml
      - .github/workflows/gateway-release.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Stacker API and upload token
        env:
          STACKER_API_URL: ${{ secrets.STACKER_API_URL }}
          STACKER_RELEASE_UPLOAD_TOKEN: ${{ secrets.STACKER_RELEASE_UPLOAD_TOKEN }}
          STACKER_ADMIN_TOKEN: ${{ secrets.STACKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STACKER_API_URL:-}" ]; then
            echo "Secret STACKER_API_URL obrigatório." >&2
            exit 1
          fi
          API_BASE="${STACKER_API_URL%/}"
          echo "API: ${API_BASE}"

          HEALTH_CODE="$(curl -sS -o /tmp/api-health.json -w '%{http_code}' "${API_BASE}/api/health" || true)"
          echo "GET /api/health → HTTP ${HEALTH_CODE}"
          cat /tmp/api-health.json || true
          echo ""
          if [ "$HEALTH_CODE" -lt 200 ] || [ "$HEALTH_CODE" -ge 300 ]; then
            echo "API inacessível (HTTP ${HEALTH_CODE}). Verifique STACKER_API_URL e se a API está no ar." >&2
            exit 1
          fi

          CI_HEALTH="$(curl -sS "${API_BASE}/api/gateway/releases/ci-upload/health" || true)"
          echo "CI upload health: ${CI_HEALTH}"

          if [ -n "${STACKER_RELEASE_UPLOAD_TOKEN:-}" ]; then
            VERIFY_CODE="$(curl -sS -w '%{http_code}' -o /tmp/token-verify.json \
              -H "X-Stacker-Release-Token: ${STACKER_RELEASE_UPLOAD_TOKEN}" \
              "${API_BASE}/api/gateway/releases/ci-upload/verify-token" || true)"
            echo "Token verify → HTTP ${VERIFY_CODE}"
            cat /tmp/token-verify.json || true
            echo ""
            if [ "$VERIFY_CODE" = "200" ]; then
              echo "Token OK."
            elif [ "$VERIFY_CODE" = "401" ]; then
              echo "Token inválido — STACKER_RELEASE_UPLOAD_TOKEN deve ser idêntico a backend/.env na VPS." >&2
              exit 1
            elif [ "$VERIFY_CODE" = "404" ]; then
              echo "Endpoint verify-token não encontrado — faça deploy da API Stacker (stacker-hub) e tente de novo." >&2
              echo "Fallback: probe POST (release antiga da API)..." >&2
              CODE="$(curl -sS -w '%{http_code}' -o /tmp/token-ping.json -X POST "${API_BASE}/api/gateway/releases/ci-upload" \
                -H "X-Stacker-Release-Token: ${STACKER_RELEASE_UPLOAD_TOKEN}" \
                -F "version=0.0.0-ci-ping" -F "title=ping" || true)"
              echo "Token probe HTTP ${CODE}"
              cat /tmp/token-ping.json || true
              if [ "$CODE" != "400" ] && [ "$CODE" != "401" ]; then
                echo "Probe falhou (HTTP ${CODE})." >&2
                exit 1
              fi
              if [ "$CODE" = "401" ]; then exit 1; fi
            else
              echo "Verificação de token falhou (HTTP ${VERIFY_CODE})." >&2
              exit 1
            fi
          elif [ -n "${STACKER_ADMIN_TOKEN:-}" ]; then
            echo "Aviso: usando STACKER_ADMIN_TOKEN (JWT expira). Prefira STACKER_RELEASE_UPLOAD_TOKEN."
          else
            echo "Configure STACKER_RELEASE_UPLOAD_TOKEN nos secrets do repo." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, intl, bcmath, pcntl, exif
          tools: composer:v2
          coverage: none

      - name: Build frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts --ignore-platform-reqs

      - name: Build production zip
        env:
          GETFY_SKIP_FRONTEND_BUILD: '1'
          GETFY_SKIP_COMPOSER_INSTALL: '1'
        run: |
          chmod +x scripts/build-release.sh scripts/read-release-changelog.sh scripts/read-release-title.sh
          bash scripts/build-release.sh
          ls -lh dist-releases/

      - name: Upload release to Stacker API
        env:
          STACKER_API_URL: ${{ secrets.STACKER_API_URL }}
          STACKER_RELEASE_UPLOAD_TOKEN: ${{ secrets.STACKER_RELEASE_UPLOAD_TOKEN }}
          STACKER_ADMIN_TOKEN: ${{ secrets.STACKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < VERSION)"
          ZIP="dist-releases/stacker-gateway-${VERSION}.zip"
          ZIP_BYTES="$(wc -c < "$ZIP")"
          echo "Versão: ${VERSION}"
          echo "Artefato: ${ZIP} (${ZIP_BYTES} bytes)"
          if [ ! -f "$ZIP" ]; then
            echo "Artefato não encontrado: $ZIP" >&2
            exit 1
          fi
          MAX_CF=$((100 * 1024 * 1024))
          if [ "$ZIP_BYTES" -gt "$MAX_CF" ]; then
            echo "Zip (${ZIP_BYTES} bytes) excede ~100MB — Cloudflare bloqueia upload com proxy laranja." >&2
            echo "Solução: Cloudflare → DNS → api.stacker.builders → desligar proxy (nuvem CINZA)." >&2
            exit 1
          fi
          RELEASE_TITLE="$(bash scripts/read-release-title.sh "$VERSION")"
          CHANGELOG_FILE="$(mktemp)"
          bash scripts/read-release-changelog.sh "$VERSION" > "$CHANGELOG_FILE"
          if [ -s "$CHANGELOG_FILE" ]; then
            echo "Changelog: docs/releases/${VERSION}.md ($(wc -c < "$CHANGELOG_FILE") bytes)"
          else
            echo "Aviso: docs/releases/${VERSION}.md ausente no repo — release sem changelog." >&2
          fi
          API="${STACKER_API_URL%/}/api/gateway/releases/ci-upload"
          UPLOAD_AUTH=()
          REPLACE_FIELD=()
          if [ -n "${STACKER_RELEASE_UPLOAD_TOKEN:-}" ]; then
            echo "Upload via STACKER_RELEASE_UPLOAD_TOKEN (replace=true)"
            UPLOAD_AUTH=(-H "X-Stacker-Release-Token: ${STACKER_RELEASE_UPLOAD_TOKEN}")
            REPLACE_FIELD=(-F "replace=true")
          elif [ -n "${STACKER_ADMIN_TOKEN:-}" ]; then
            echo "Upload via STACKER_ADMIN_TOKEN"
            API="${STACKER_API_URL%/}/api/gateway/releases"
            UPLOAD_AUTH=(-H "Authorization: Bearer ${STACKER_ADMIN_TOKEN}")
          else
            echo "Configure STACKER_RELEASE_UPLOAD_TOKEN ou STACKER_ADMIN_TOKEN nos secrets." >&2
            exit 1
          fi
          if [ -s "$CHANGELOG_FILE" ]; then
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/stacker-upload.json -X POST "$API" \
              "${UPLOAD_AUTH[@]}" \
              "${REPLACE_FIELD[@]}" \
              -F "artifact=@${ZIP}" \
              -F "version=${VERSION}" \
              -F "title=${RELEASE_TITLE}" \
              -F "changelog=@${CHANGELOG_FILE};type=text/plain")"
          else
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/stacker-upload.json -X POST "$API" \
              "${UPLOAD_AUTH[@]}" \
              "${REPLACE_FIELD[@]}" \
              -F "artifact=@${ZIP}" \
              -F "version=${VERSION}" \
              -F "title=${RELEASE_TITLE}")"
          fi
          rm -f "$CHANGELOG_FILE"
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/stacker-upload.json
          if [ "$HTTP_CODE" = "409" ]; then
            echo "Versão ${VERSION} já existe e replace não foi aceito — faça deploy da API Stacker ou apague a release no admin." >&2
            exit 1
          fi
          if [ "$HTTP_CODE" = "413" ]; then
            echo "Upload rejeitado (413). Cloudflare/proxy limita ~100MB — use DNS only em api.stacker.builders." >&2
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Upload falhou (HTTP ${HTTP_CODE})." >&2
            exit 1
          fi
          echo "Release v${VERSION} publicada com sucesso."
